{title:'Das elektrische Feld',sub:'Kräfte im Raum',time:7,goal:'Die Wirkung eines elektrischen Feldes und die Bedeutung von Feldlinien werden erschlossen.',prompts:'Begriff des elektrischen Feldes, Feldrichtung, Bedeutung der Feldliniendichte.'},
{title:'Influenz',sub:'Ladungstrennung',time:8,goal:'Die Verschiebung von Ladungen in einem Leiter ohne Berührung wird erklärt.',prompts:'Ursache, Ablauf und Ergebnis der Influenz; eine beschriftete Skizze.'},
{title:'Das Elektroskop',sub:'Ladung sichtbar machen',time:8,goal:'Der Aufbau und die Funktionsweise eines Elektroskops werden beschrieben.',prompts:'Aufbau, Erklärung des Ausschlags bei Annäherung oder Kontakt, Grenzen des Nachweises.'},
{title:'Ladung und Stromstärke',sub:'Vom Strom zur Ladungsmenge',time:8,goal:'Der Zusammenhang zwischen transportierter Ladung, Stromstärke und Zeit wird hergeleitet.',prompts:'Leiterquerschnitt als Modell, Definition von I, Herleitung Q = I · t, Einheiten.'},
{title:'Elementarladung',sub:'Die kleinste Ladungsportion',time:7,goal:'Die Elementarladung und die Ladungsquantelung werden eingeordnet.',prompts:'Bedeutung und Wert von e, Elektron und Proton, Millikan-Versuch, Q = N · e (mit Vorzeichen).'},
{title:'Coulombgesetz',sub:'Kraft zwischen Punktladungen',time:10,goal:'Die Kraft zwischen zwei ruhenden Punktladungen wird quantitativ bestimmt.',prompts:'Formel, Größen und Einheiten, Abstandsabhängigkeit, Kraftwirkung und Beispielrechnung.'}
];

function clock(){const left=Math.max(0,3600-Math.floor((Date.now()-state.start)/1000));const safe=Math.min(3600,left);$('timer').textContent=String(Math.floor(safe/60)).padStart(2,'0')+':'+String(safe%60).padStart(2,'0');$('timerbox').classList.toggle('warn',safe<=600&&safe>0);$('timerbox').classList.toggle('done',safe===0);$('timebar').style.width=(safe/36)+'%';if(safe===0){$('timerbox').querySelector('small').textContent='Zeit abgelaufen';} }
function nav(){let items=chapters.map((c,i)=>`<button class="navbtn ${page===i?'active':''} ${state.done[i]?'complete':''}" data-page="${i}" ${page===i?'aria-current="page"':''}><span class="num">${state.done[i]?'✓':String(i+1).padStart(2,'0')}</span><span><b>${c.title}</b><small>${c.sub} · ${c.time} min</small></span></button>`);items.push(`<button class="navbtn ${page===7?'active':''}" data-page="7" ${page===7?'aria-current="page"':''}><span class="num">✓</span><span><b>Abschluss</b><small>Tafelbild im Hefter · 5 min</small></span></button>`);$('nav').innerHTML=items.join('');let n=state.done.filter(Boolean).length;$('progresstext').textContent=`${n} von 7 Kapiteln bearbeitet`;$('progressbar').style.width=(n/7*100)+'%';$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>go(+b.dataset.page));}

const checkpoint=(q,a)=>`<div class="card checkpoint"><h3>Verständnischeck</h3><p>${q}</p><details><summary>Erklärung zum Selbstabgleich</summary><p>${a}</p></details></div>`;
const card=(title,body)=>`<div class="card"><h3>${title}</h3>${body}</div>`;
function intro(){return `<div class="hero"><div class="eyebrow">Selbstlernkurs / Grundkurs Physik</div><h1>Elektrische Ladung &amp; elektrisches Feld</h1><p>Von der elektrischen Ladung über die Influenz bis zur quantitativen Beschreibung elektrischer Kräfte: Sieben Stationen bilden die Grundlage für ein eigenständig erarbeitetes Tafelbild im Hefter.</p><div class="meta"><span class="tag">Klasse 11</span><span class="tag">60 Minuten</span><span class="tag">7 Lernstationen</span><span class="tag">Offline nutzbar</span></div></div><div class="task"><div class="symbol">↳</div><div><strong>Arbeitsauftrag</strong><p>Die Informationen der Kapitel werden selbstständig erschlossen. Zu jeder Station werden die wesentlichen Zusammenhänge, Fachbegriffe, Formeln und geeignete Skizzen in eigenen Worten im Hefter festgehalten. Am Ende entsteht daraus ein übersichtliches Tafelbild. Die Zeitangaben dienen der Orientierung.</p></div></div>`;}
function note(i){return `<div class="notes"><h3>Arbeitsauftrag für das Tafelbild</h3><p>${chapters[i].prompts} Die Inhalte werden stichpunktartig im Hefter festgehalten und gegebenenfalls durch eigene Skizzen ergänzt.</p><ul class="worklist"><li>notiere die wichtigsten Fachbegriffe, Formelzeichen und Einheiten,</li><li>halte zentrale Zusammenhänge in eigenen Worten fest,</li><li>ergänze geeignete Skizzen oder beschriftete Schemata.</li></ul><label class="chapterdone"><input type="checkbox" id="donecheck" ${state.done[i]?'checked':''}> Kapitel bearbeitet</label><div class="notes-foot"><span class="saved">${storageOK?'Bearbeitungsstand lokal gespeichert':'Keine lokale Speicherung verfügbar'}</span></div></div>`;}
function chapter1(){let parts='';for(let i=0;i<4;i++){const x=124+(i%2)*42,y=83+Math.floor(i/2)*42;parts+=charge(x,y,'+',13)+charge(x+125,y,'−',13)}let body=svg(`${arrow('a1')}<rect x="80" y="48" width="205" height="125" rx="18" fill="#183247" stroke="#46677e"/><text x="182" y="29" text-anchor="middle">neutraler Körper</text>${parts}<text x="182" y="198" text-anchor="middle" class="small">gleich viele + und − Ladungen</text><path d="M302 109H375" stroke="#6ce2ec" stroke-width="2" marker-end="url(#a1)"/><text x="339" y="92" class="small" text-anchor="middle">Elektronen</text><text x="339" y="141" class="small" text-anchor="middle">abgegeben</text><rect x="392" y="48" width="170" height="125" rx="18" fill="#183247" stroke="#46677e"/><text x="477" y="29" text-anchor="middle">positiv geladen</text>${charge(427,83,'+',13)}${charge(466,83,'+',13)}${charge(427,125,'+',13)}${charge(466,125,'+',13)}${charge(526,83,'−',13)}${charge(526,125,'−',13)}<text x="477" y="198" text-anchor="middle" class="small">Elektronenmangel</text><text x="320" y="245" text-anchor="middle" class="small">Die positiven Ladungen bleiben im Körper gebunden.</text>`,'Neutraler Körper mit vier positiven und vier negativen Modellladungen. Nach Abgabe zweier Elektronen bleibt ein positiver Überschuss.');return card('Warum ist ein Körper elektrisch geladen?',`<p>Beim Reiben eines Kunststoffstabs an einem Tuch können Elektronen von einem Körper auf den anderen übertragen werden. Die Körper sind anschließend entgegengesetzt geladen. Elektrische Ladung ist eine Eigenschaft von Teilchen und Körpern, durch die elektrische Kräfte hervorgerufen werden können.</p><p>Ein Körper ist elektrisch neutral, wenn sich seine positiven und negativen Ladungen insgesamt ausgleichen. Bei einem Elektronenüberschuss ist seine Gesamtladung negativ, bei einem Elektronenmangel positiv. Ladung wird übertragen oder getrennt, nicht neu erzeugt; die Gesamtladung eines abgeschlossenen Systems bleibt erhalten.</p>`)+figure('01','Ladungsbilanz',body,'Schematische Darstellung: Die Anzahl der Symbole dient nur zur Veranschaulichung. Die Ladung des Körpers ändert sich durch Elektronenübertragung.')+`<div class="split">${card('Die physikalische Größe',`<table class="table"><tr><th>Größe</th><th>Angabe</th></tr><tr><td>Elektrische Ladung</td><td>Q</td></tr><tr><td>SI-Einheit</td><td>Coulomb (C)</td></tr><tr><td>Einheitenbeziehung</td><td>1 C = 1 A · s</td></tr></table><p class="muted">Das Vorzeichen von Q gibt die Ladungsart an. Q = 0 bedeutet insgesamt neutral.</p>`)}${card('Wechselwirkung',`<p>Gleichnamige Ladungen stoßen sich ab. Ungleichnamige Ladungen ziehen sich an.</p><div class="diagram">${svg(`${arrow('a1f')} ${charge(72,55,'+',17)}${charge(200,55,'+',17)}<path d="M50 55H16M222 55h34" stroke="#6ce2ec" stroke-width="2.5" marker-end="url(#a1f)"/>${charge(72,125,'+',17)}${charge(200,125,'−',17)}<path d="M94 125h35M178 125h-35" stroke="#6ce2ec" stroke-width="2.5" marker-end="url(#a1f)"/>`,'Gleichnamige Ladungen stoßen sich ab, ungleichnamige ziehen sich an.','0 0 272 180')}</div>`)}</div>`+checkpoint('Ein neutraler Kunststoffstab nimmt Elektronen auf. Welches Vorzeichen besitzt seine Ladung danach?','Die Gesamtladung ist negativ, da mehr negative als positive Ladung vorhanden ist.');}
function chapter2(){let rays='';for(let i=0;i<8;i++){let a=i*Math.PI/4, c=Math.cos(a),s=Math.sin(a);rays+=`<path d="M${160+26*c} ${132+26*s}L${160+99*c} ${132+99*s}" stroke="#6ce2ec" stroke-width="2" marker-end="url(#f2)"/><path d="M${480+99*c} ${132+99*s}L${480+26*c} ${132+26*s}" stroke="#6ce2ec" stroke-width="2" marker-end="url(#f2)"/>`;}return card('Eine Kraftwirkung ohne Berührung',`<p>Im Raum um eine elektrische Ladung besteht ein elektrisches Feld. Wird eine weitere Ladung in dieses Feld gebracht, kann auf sie eine elektrische Kraft wirken – auch ohne direkten Kontakt. Das Feld vermittelt die Wechselwirkung.</p><p>Als Feldrichtung wird die Richtung definiert, in die eine kleine positive Probeladung gedrückt würde. Eine negative Probeladung erfährt eine Kraft entgegen der Feldrichtung.</p>`)+figure('02','Feldlinien einzelner Punktladungen',svg(`${arrow('f2')}${rays}${charge(160,132,'+',22)}${charge(480,132,'−',22)}<text x="160" y="260" text-anchor="middle">positive Punktladung</text><text x="480" y="260" text-anchor="middle">negative Punktladung</text>`,'Radiale Feldlinien zeigen von einer positiven Punktladung weg und zu einer negativen Punktladung hin.'),'Feldlinien geben die Feldrichtung an; sie sind gedachte Linien und keine materiellen Fäden.')+`<div class="split">${card('Das Feldlinienmodell',`<ul><li>Feldlinien beginnen an positiven Ladungen und enden an negativen Ladungen oder im Unendlichen; sie können auch aus dem Unendlichen kommen.</li><li>Die Tangente an eine Feldlinie gibt die lokale Feldrichtung an.</li><li>Je dichter die Feldlinien in einer konsistenten Darstellung liegen, desto stärker ist das Feld.</li><li>Feldlinien schneiden sich nicht.</li></ul>`)}${card('Feld und Kraft',`<p>Die elektrische Feldstärke E beschreibt die Kraft pro positiver Probeladung q:</p><div class="formula">E = <span class="frac"><span>F</span><span>q</span></span><small>für eine positive Probeladung; Einheit <span class="frac"><span>N</span><span>C</span></span></small></div><p class="muted">Der Feldstärkebegriff dient hier der Einordnung. Die Berechnung elektrischer Kräfte folgt in Kapitel 7.</p>`)}</div>`+checkpoint('In welche Richtung wirkt die Kraft auf ein Elektron im Feld einer positiven Punktladung?','Zum positiven Körper hin. Das Elektron ist negativ geladen und wird angezogen; seine Kraft ist der nach außen gerichteten Feldrichtung entgegengesetzt.');}
function infSVG(){let p='';for(let i=0;i<6;i++){const y=95+Math.floor(i/3)*66,x=294+(i%3)*89;p+=charge(x,y,'+',12)}for(let i=0;i<6;i++){let x,y;if(influence===0){x=327+(i%3)*89;y=95+Math.floor(i/3)*66;}else{x=(influence===1?257:540)+(i%2)*22;y=77+Math.floor(i/2)*44;}p+=charge(x,y,'−',10)}let rod=influence?`<rect x="36" y="45" width="75" height="166" rx="14" fill="#19354a" stroke="#527891"/>${[75,115,155,195].map(y=>charge(73,y,influence===1?'+':'−',13)).join('')}<text x="73" y="233" text-anchor="middle" class="small">geladener Stab</text>`:'';return svg(`${arrow('infA')}${rod}<rect x="235" y="45" width="350" height="166" rx="22" fill="#203d50" stroke="#91b2c7" stroke-width="1.5"/>${p}${influence?`<path d="M${influence===1?390:340} 132h${influence===1?-79:138}" stroke="#6ce2ec" stroke-width="2.5" marker-end="url(#infA)"/><text x="410" y="238" text-anchor="middle" class="small">Elektronen verschieben sich ${influence===1?'zum Stab':'vom Stab weg'}</text>`:'<text x="410" y="238" text-anchor="middle" class="small">bewegliche Elektronen gleichmäßig verteilt</text>'}<text x="410" y="27" text-anchor="middle">isolierter Metallleiter</text><text x="410" y="263" text-anchor="middle" class="small">Gesamtladung des Leiters: Q = 0</text>`,'Influenz im neutralen Metallleiter: positive Atomrümpfe bleiben ortsfest, bewegliche Elektronen werden abhängig vom Vorzeichen des Stabs umverteilt.');}
function chapter3(){return card('Wie wird Ladung ohne Berührung getrennt?',`<p>In einem Metall sind einige Elektronen beweglich, während die positiven Atomrümpfe im Gitter gebunden bleiben. Wird ein geladener Körper angenähert, wirkt dessen elektrisches Feld auf die beweglichen Elektronen. Dadurch werden die Elektronen innerhalb des Leiters umverteilt.</p><p>Dieser Vorgang wird <strong>Influenz</strong> genannt. Bei einem positiv geladenen Stab werden Elektronen angezogen; bei einem negativ geladenen Stab werden sie abgestoßen. Auf den beiden Seiten des Leiters entstehen entgegengesetzte Ladungsüberschüsse. Ohne Berührung oder Erdung bleibt ein ursprünglich neutraler Leiter insgesamt neutral.</p>`)+figure('03','Influenz am Metallleiter',`<div id="infmodel">${infSVG()}</div>`,'Die positiven Symbole stehen für ortsfeste Atomrümpfe, die negativen für bewegliche Elektronen. Es handelt sich um ein vereinfachtes Ladungsmodell.',`<div class="controlbar" id="infcontrols"><button class="chip" data-v="0">Kein Stab</button><button class="chip" data-v="1">Positiver Stab</button><button class="chip" data-v="2">Negativer Stab</button></div><div class="modelstatus" id="infstatus" aria-live="polite"></div>`)+card('Was passiert beim Entfernen des Stabs?',`<p>Wird der geladene Körper entfernt, fällt die Ursache der Ladungstrennung weg. Die beweglichen Elektronen verteilen sich wieder so, dass der isolierte Leiter im elektrostatischen Gleichgewicht keine getrennten Überschüsse mehr besitzt.</p><p class="muted">Influenz ist von der Ladungsübertragung durch direkten Kontakt zu unterscheiden. Eine dauerhafte Aufladung durch Influenz erfordert einen zusätzlichen Schritt, beispielsweise eine Erdung.</p>`)+checkpoint('Ein negativ geladener Stab wird links an einen neutralen Metallkörper angenähert. Welche Seite wird negativ?','Die dem Stab abgewandte rechte Seite. Elektronen werden abgestoßen und sammeln sich dort; links entsteht ein Elektronenmangel.');}
function elecSVG(){let def=electro?55:0;let rod=electro===1?`<rect x="98" y="13" width="95" height="42" rx="9" fill="#243c52" stroke="#54748d"/>${[116,145,174].map(x=>charge(x,34,'−',10)).join('')}<text x="85" y="77" class="small">negativer Stab</text><path d="M203 34h43" stroke="#6ce2ec" stroke-width="2" stroke-dasharray="5 5"/>`:'';let signs=electro?`${charge(298,electro===1?48:66,electro===1?'+':'−',10)}${charge(342,electro===1?48:66,electro===1?'+':'−',10)}${charge(294-def*.60,198,'−',10)}${charge(346+def*.60,198,'−',10)}`:'';return svg(`${rod}<rect x="230" y="85" width="180" height="170" rx="24" fill="#132e42" fill-opacity=".5" stroke="#54768e" stroke-width="2"/><rect x="286" y="78" width="68" height="20" rx="5" fill="#a3b9c8" stroke="#d2e6ef"/><ellipse cx="320" cy="54" rx="54" ry="13" fill="#a5c0d0" stroke="#e3eef6" stroke-width="2"/><path d="M320 66V162" stroke="#b9d1df" stroke-width="8" stroke-linecap="round"/><path d="M320 160L${318-def} 233M320 160L${322+def} 233" stroke="#ffd18c" stroke-width="5" stroke-linecap="round"/>${signs}<path d="M373 54h56" stroke="#8faec1"/><text x="438" y="58" class="small">Metallplatte</text><path d="M354 87h75" stroke="#8faec1"/><text x="438" y="91" class="small">Isolator</text><path d="M325 125h104" stroke="#8faec1"/><text x="438" y="129" class="small">Metallstab</text><path d="M${322+def} 233h${429-322-def}" stroke="#8faec1"/><text x="438" y="237" class="small">Metallblättchen</text>`,'Elektroskop mit Metallplatte, isoliertem Metallstab und zwei beweglichen Metallblättchen. '+(electro?'Die Blättchen sind gleichnamig geladen und gespreizt.':'Die Blättchen hängen ohne Ausschlag herab.'));}
function chapter4(){return card('Ein Gerät zum Nachweis elektrischer Ladung',`<p>Ein Blättchenelektroskop besteht aus einer Metallplatte, einem leitend verbundenen Metallstab und zwei dünnen beweglichen Metallblättchen. Der leitende Teil ist gegenüber der Umgebung isoliert. Im neutralen Zustand ohne äußeres elektrisches Feld hängen die Blättchen nahezu parallel nach unten.</p><p>Wird ein negativ geladener Körper angenähert, werden Elektronen von der Platte in Richtung Blättchen verschoben. Beide Blättchen werden negativ geladen und stoßen sich ab. Ein Ausschlag wird sichtbar. Bei Berührung mit einem geeigneten geladenen Körper kann Ladung übertragen werden; danach kann der Ausschlag auch ohne angenäherten Körper bestehen bleiben.</p>`)+figure('04','Blättchenelektroskop',`<div id="elecmodel">${elecSVG()}</div>`,'Die Spreizung der Blättchen wird im Modell vergrößert dargestellt. Der Isolator verhindert einen unmittelbaren Ladungsabfluss.',`<div class="controlbar" id="eleccontrols"><button class="chip" data-v="0">Neutral / entladen</button><button class="chip" data-v="1">Negativen Stab annähern</button><button class="chip" data-v="2">Nach negativer Aufladung</button></div><div class="modelstatus" id="elecstatus" aria-live="polite"></div>`)+card('Was kann nachgewiesen werden?',`<p>Ein Ausschlag zeigt, dass eine elektrische Ladungstrennung oder Aufladung stattgefunden hat. Bei vergleichbaren Bedingungen kann ein größerer Ausschlag auf eine größere Ladungsmenge hinweisen. Ohne weitere Vergleichsmessung kann das Vorzeichen der Ladung jedoch nicht eindeutig bestimmt werden.</p>`)+checkpoint('Warum fallen die Blättchen nach der Entfernung eines nur angenäherten Stabs wieder zusammen?','Die Influenz endet, die Ladungen verteilen sich wieder. Ohne Ladungsübertragung bleibt das Elektroskop neutral; die Abstoßung der Blättchen verschwindet.');}
function flowSVG(){let p='';for(let i=0;i<12;i++){let x=57+(i%6)*90,y=99+Math.floor(i/6)*45;p+=charge(x,y,'−',11)}return svg(`${arrow('flowA')}<rect x="27" y="66" width="586" height="110" rx="18" fill="#233b4d" stroke="#7397ac" stroke-width="1.5"/><ellipse cx="320" cy="121" rx="13" ry="55" fill="#6ce2ec" fill-opacity=".15" stroke="#6ce2ec" stroke-width="2" stroke-dasharray="5 4"/>${p}<path d="M100 32h173" stroke="#69afff" stroke-width="2.5" marker-end="url(#flowA)"/><text x="186" y="23" text-anchor="middle" class="small">Elektronenbewegung</text><path d="M540 32H367" stroke="#6ce2ec" stroke-width="2.5" marker-end="url(#flowA)"/><text x="454" y="23" text-anchor="middle" class="small">technische Stromrichtung</text><path d="M320 177v38" stroke="#6ce2ec" stroke-width="1.5"/><text x="320" y="236" text-anchor="middle">gedachter Leiterquerschnitt</text><text x="320" y="259" text-anchor="middle" class="small">In der Zeit Δt passiert Ladung ΔQ die markierte Fläche.</text>`,'Leiter mit beweglichen Elektronen, einem gedachten Querschnitt und gegenläufiger technischer Stromrichtung.');}
function chapter5(){return card('Was wird durch die Stromstärke angegeben?',`<p>In einem stromdurchflossenen Metallleiter werden elektrische Ladungen transportiert. Zur Beschreibung wird ein gedachter Querschnitt durch den Leiter gelegt. Innerhalb eines Zeitintervalls Δt passiert eine bestimmte Ladungsmenge ΔQ diesen Querschnitt.</p><p>Je mehr Ladung in derselben Zeit hindurchtritt, desto größer ist die Stromstärke. Die mittlere Stromstärke wird daher als transportierte Ladungsmenge pro Zeit definiert (hier werden die Beträge betrachtet).</p><div class="formula">I = <span class="frac"><span>ΔQ</span><span>Δt</span></span></div><p>Bei konstanter Stromstärke und einer betrachteten Dauer t ergibt sich durch Multiplikation mit t die transportierte Ladungsmenge Q:</p><div class="formula">Q = I · t</div><p>Damit folgt aus den Einheiten von Stromstärke und Zeit: 1 C = 1 A · s. Eine Stromstärke von 1 A entspricht einer transportierten Ladungsmenge von 1 C pro Sekunde.</p>`)+figure('05','Ladungstransport durch einen Leiterquerschnitt',flowSVG(),'Das Modell zeigt die Elektronenbewegung in einem Metall. Die technische Stromrichtung ist entgegengesetzt. Die Anzahl gezeichneter Elektronen ist nicht maßstäblich.')+card('Interaktives Rechenmodell',`<p>Die Stromstärke und die Zeit können unabhängig voneinander verändert werden. Die transportierte Ladungsmenge wird aus den gewählten Werten berechnet.</p><div class="sliderrow"><label for="curr">Stromstärke I</label><output id="currout"></output><input id="curr" type="range" min="0" max="5" step="0.5" value="${current}"></div><div class="sliderrow"><label for="sec">Zeit t</label><output id="secout"></output><input id="sec" type="range" min="1" max="10" step="1" value="${seconds}"></div><div class="metricrow"><div class="metric"><small>Stromstärke</small><b id="mI"></b></div><div class="metric"><small>Zeit</small><b id="mt"></b></div><div class="metric"><small>Transportierte Ladung</small><b id="mQ"></b></div></div><div class="formula" id="qformula"></div>`)+checkpoint('Bei konstanten 0,5 A fließt 8 s lang Strom. Welche Ladungsmenge wird transportiert?','Q = I · t = 0,5 A · 8 s = 4 A · s = 4 C.');}
function chapter6(){return card('Die Ladung besitzt eine natürliche Portionierung',`<p>Die Ladung eines Protons ist positiv, die eines Elektrons negativ. Beide besitzen denselben Ladungsbetrag. Dieser Betrag wird als <strong>Elementarladung e</strong> bezeichnet.</p><div class="formula">e = 1,602 176 634 · 10<sup>−19</sup> C<small>exakter SI-Wert; für Rechnungen meist e ≈ 1,60 · 10⁻¹⁹ C</small></div><p>Ein Elektron trägt die Ladung −e, ein Proton die Ladung +e. Die Gesamtladung gewöhnlicher Körper tritt in ganzzahligen Vielfachen von e auf. Bei N überschüssigen Elektronen gilt Q = −N · e, bei N fehlenden Elektronen Q = +N · e.</p>`)+figure('06','Ladungsquantelung',svg(`${charge(107,100,'−',31)}<text x="107" y="156" text-anchor="middle">Elektron</text><text x="107" y="180" text-anchor="middle" class="accent">−e</text>${charge(320,100,'+',31)}<text x="320" y="156" text-anchor="middle">Proton</text><text x="320" y="180" text-anchor="middle" class="accent">+e</text>${charge(499,85,'−',17)}${charge(539,85,'−',17)}${charge(519,120,'−',17)}<text x="519" y="156" text-anchor="middle">3 Elektronen</text><text x="519" y="180" text-anchor="middle" class="accent">−3e</text><text x="320" y="240" text-anchor="middle" class="small">Die Ladungen werden hier symbolisch und nicht maßstäblich dargestellt.</text>`,'Elektron mit −e, Proton mit +e und drei Elektronen mit Gesamtladung −3e.'),'Elektron und Proton haben denselben Ladungsbetrag, aber entgegengesetzte Vorzeichen.')+`<div class="split">${card('Woher ist der Wert bekannt?',`<p>Robert A. Millikan bestimmte mit seinem Öltröpfchenversuch zu Beginn des 20. Jahrhunderts die Elementarladung. Die Bewegung elektrisch geladener Öltröpfchen wurde in einem elektrischen Feld zwischen zwei Platten untersucht. Aus dem Kräftegleichgewicht und weiteren Messgrößen konnten die Ladungen der Tröpfchen bestimmt werden.</p><p>Die gemessenen Ladungen entsprachen ganzzahligen Vielfachen einer kleinsten gemeinsamen Ladungsportion. Seit der SI-Neudefinition 2019 ist der Zahlenwert von e exakt festgelegt.</p>`)}${figure('07','Prinzip des Millikan-Versuchs',svg(`${arrow('mG','#ffd18c')}${arrow('mE','#6ce2ec')}<rect x="60" y="37" width="500" height="17" rx="4" fill="#a5c0d0"/><rect x="60" y="225" width="500" height="17" rx="4" fill="#a5c0d0"/>${[110,210,310,410,510].map(x=>`<text x="${x}" y="30" text-anchor="middle" class="pos">+</text><text x="${x}" y="263" text-anchor="middle" class="neg">−</text>`).join('')}<circle cx="310" cy="139" r="14" fill="#f3bb65" stroke="#ffe4b0" stroke-width="2"/><text x="310" y="144" text-anchor="middle" style="fill:#13202c;font-weight:800">−</text><path d="M310 122V76" stroke="#6ce2ec" stroke-width="3" marker-end="url(#mE)"/><text x="329" y="89" class="accent">Fₑₗ</text><path d="M310 156v49" stroke="#ffd18c" stroke-width="3" marker-end="url(#mG)"/><text x="329" y="200" fill="#ffd18c">F<tspan baseline-shift="sub" font-size="10">G,eff</tspan></text><text x="90" y="123" class="small">negativ geladenes</text><text x="90" y="141" class="small">Öltröpfchen</text>`,'Negativ geladenes Öltröpfchen zwischen einer positiven oberen und negativen unteren Platte. Elektrische Kraft nach oben, effektive Gewichtskraft nach unten.'),'Vereinfachtes Schwebeprinzip: elektrische Kraft und effektive Gewichtskraft (Gewicht abzüglich Auftrieb) gleichen sich aus.')}</div>`+checkpoint('Welche Ladung tragen fünf überschüssige Elektronen insgesamt?','Q = −5e ≈ −8,0 · 10⁻¹⁹ C.');}
function coulSVG(){const x1=100,x2=100+distance/60*430;const m=sign===1?'#ffd18c':'#6ce2ec';let xA=sign===1?x1-22:x1+22,xB=sign===1?x2+22:x2-22;let len=Math.min(45,Math.max(12,(x2-x1-45)/2));return svg(`${arrow('cA',m)}<path d="M${x1} 176v25M${x2} 176v25M${x1} 192H${x2}" stroke="#a8bfd2" stroke-width="1.3"/><text x="${(x1+x2)/2}" y="219" text-anchor="middle" class="small">r = ${fmt(distance/100)} m</text>${charge(x1,130,'+',19)}${charge(x2,130,sign===1?'+':'−',19)}<text x="${x1}" y="87" text-anchor="middle">Q₁</text><text x="${x2}" y="87" text-anchor="middle">Q₂</text><path d="M${xA} 130h${sign===1?-len:len}M${xB} 130h${sign===1?len:-len}" stroke="${m}" stroke-width="3" marker-end="url(#cA)"/><text x="320" y="45" text-anchor="middle" class="accent">${sign===1?'Abstoßung':'Anziehung'}</text><text x="320" y="257" text-anchor="middle" class="small">Die Kräfte haben denselben Betrag und entgegengesetzte Richtungen.</text>`,'Zwei Punktladungen mit Abstand r; die elektrischen Kräfte zeigen '+(sign===1?'voneinander weg.':'aufeinander zu.'));}
function chapter7(){return card('Die Kraft zwischen zwei Punktladungen',`<p>Das Coulombgesetz beschreibt die elektrische Kraft zwischen zwei ruhenden Punktladungen. In der dargestellten Form zeigt das Vorzeichen von F<sub>C</sub> an, ob die Kraft abstoßend (+) oder anziehend (−) wirkt. Der Betrag der Kraft ist |F<sub>C</sub>|. Die Kraft steigt mit den Beträgen der Ladungen und sinkt mit dem Quadrat ihres Abstands. Für Vakuum und näherungsweise Luft wird die relative Permittivität ε<sub>r</sub> = 1 verwendet.</p><div class="formula coulomb-main"><span class="equation"><span>F<sub>C</sub></span> = <span class="frac"><span>1</span><span>4 · π · ε₀</span></span> · <span class="frac"><span>q₁ · q₂</span><span>r²</span></span></span><span class="constant">mit ε₀ = 8,854 · 10⁻¹² <span class="frac"><span>A · s</span><span>V · m</span></span></span></div><table class="table"><tr><th>Formelzeichen</th><th>Bedeutung</th><th>Einheit</th></tr><tr><td>F<sub>C</sub></td><td>Elektrische Kraft (mit Vorzeichen)</td><td>N</td></tr><tr><td>q₁, q₂</td><td>Elektrische Ladungen</td><td>C</td></tr><tr><td>r</td><td>Abstand der Punktladungen</td><td>m</td></tr><tr><td>ε₀</td><td>Elektrische Feldkonstante</td><td><span class="frac"><span>A · s</span><span>V · m</span></span></td></tr></table><p class="muted">Für den Grundkurs genügt hier ε<sub>r</sub> = 1. Damit wird nur mit der Feldkonstante ε₀ gerechnet.</p>`)+figure('08','Kraftwirkung und Abstand',`<div id="coulmodel">${coulSVG()}</div>`,'Die Pfeile zeigen die Kraftrichtungen; ihre Länge ist nicht als Kraftmaßstab zu verstehen.',`<div class="controlbar" id="signcontrols"><button class="chip" data-v="-1">Ungleichnamig</button><button class="chip" data-v="1">Gleichnamig</button></div><div class="sliderrow"><label for="dist">Abstand r</label><output id="distout"></output><input type="range" id="dist" min="15" max="60" step="5" value="${distance}"></div><div class="metricrow"><div class="metric"><small>q₁</small><b>+2 µC</b></div><div class="metric"><small>q₂</small><b id="charge2"></b></div><div class="metric"><small>Kraftbetrag F<sub>C</sub></small><b id="force"></b></div></div>`)+card('Beispielrechnung',`<p>Zwei Punktladungen q₁ = +2,0 µC und q₂ = −3,0 µC befinden sich in Luft in einem Abstand von r = 0,30 m. Gesucht sind die elektrische Kraft F<sub>C</sub> und ihr Betrag.</p><div class="step"><span class="n">1</span><div><strong>Gegeben</strong><p>q₁ = +2,0 · 10⁻⁶ C; q₂ = −3,0 · 10⁻⁶ C; r = 0,30 m; ε<sub>r</sub> = 1</p></div></div><div class="step"><span class="n">2</span><div><strong>Ansatz</strong><div class="formula">F<sub>C</sub> = <span class="frac"><span>1</span><span>4 · π · ε₀</span></span> · <span class="frac"><span>q₁ · q₂</span><span>r²</span></span></div><p>ε₀ = 8,854 · 10⁻¹² <span class="frac"><span>A · s</span><span>V · m</span></span></p></div></div><div class="step"><span class="n">3</span><div><strong>Einsetzen</strong><div class="formula" style="font-size:clamp(16px,2.2vw,24px)">F<sub>C</sub> = <span class="frac"><span>1</span><span>4 · π · 8,854 · 10⁻¹² <span class="frac"><span>A · s</span><span>V · m</span></span></span></span> · <span class="frac"><span>(+2,0 · 10⁻⁶ C) · (−3,0 · 10⁻⁶ C)</span><span>(0,30 m)²</span></span></div></div></div><div class="step"><span class="n">4</span><div><strong>Ergebnis</strong><p>F<sub>C</sub> ≈ −0,60 N; |F<sub>C</sub>| ≈ 0,60 N. Das negative Vorzeichen zeigt an, dass sich die entgegengesetzt geladenen Körper anziehen.</p></div></div>`)+checkpoint('Was geschieht mit dem Kraftbetrag, wenn der Abstand verdoppelt wird und die Ladungen unverändert bleiben?','Der Betrag sinkt auf ein Viertel: |F<sub>C</sub>| ∝ <span class="frac"><span>1</span><span>r²</span></span>. Aus 0,60 N werden bei 0,60 m etwa 0,15 N.');}
const content=[chapter1,chapter2,chapter3,chapter4,chapter5,chapter6,chapter7];
function board(){let done=state.done.filter(Boolean).length;return `<div class="hero"><div class="eyebrow">Abschluss / 5 Minuten</div><h1>Tafelbild im Hefter fertigstellen</h1><p>Die in den sieben Stationen erarbeiteten Inhalte werden nun in ein übersichtliches Tafelbild im Hefter überführt. Digitale Notizen oder ein Export sind nicht vorgesehen.</p><div class="meta"><span class="tag">${done} von 7 Kapiteln bearbeitet</span><span class="tag">analoge Sicherung</span></div></div><div class="task"><div class="symbol">✓</div><div><strong>Abschlussauftrag</strong><p>Ordne die Inhalte sinnvoll, ergänze die wichtigsten Formeln mit Formelzeichen und Einheiten und vervollständige passende Skizzen zu Influenz, Elektroskop und Leiterquerschnitt. Nutze die App als Informationsgrundlage, das Tafelbild entsteht ausschließlich im Hefter.</p></div></div><div class="card"><h3>Checkliste für das Tafelbild</h3><ul><li>Definition der Ladung Q mit Formelzeichen und Einheit</li><li>Elektrisches Feld: Feldrichtung und Feldlinien</li><li>Ladungstrennung durch Influenz</li><li>Funktionsweise des Elektroskops</li><li>Herleitung von Q = I · t</li><li>Elementarladung e und Ladungsquantelung</li><li>Coulombgesetz mit Beispielrechnung</li></ul><p class="muted">Sobald alles im Hefter gesichert ist, kann die Arbeitsphase beendet werden.</p></div><div class="bottomnav"><button class="secondary" id="backbtn">← Coulombgesetz</button><button class="secondary" id="resetbtn">Neue 60-Minuten-Einheit</button></div>`;}
function bindGroup(id,value,fn){$(id).querySelectorAll('button').forEach(b=>{b.setAttribute('aria-pressed',String(+b.dataset.v===value));b.onclick=()=>fn(+b.dataset.v)});}
function updateInf(){ $('infmodel').innerHTML=infSVG();bindGroup('infcontrols',influence,v=>{influence=v;updateInf()});$('infstatus').textContent=['Ohne äußeres Feld: keine getrennten Ladungsüberschüsse.','Positiver Stab: links Elektronenüberschuss (−), rechts Elektronenmangel (+).','Negativer Stab: links Elektronenmangel (+), rechts Elektronenüberschuss (−).'][influence];}
function updateElec(){ $('elecmodel').innerHTML=elecSVG();bindGroup('eleccontrols',electro,v=>{electro=v;updateElec()});$('elecstatus').textContent=['Das Elektroskop ist neutral. Die Blättchen hängen nach unten.','Influenz: Die Platte besitzt einen positiven Überschuss, die Blättchen einen negativen. Das Gerät bleibt insgesamt neutral.','Nach Ladungsübertragung: Beide Blättchen sind negativ geladen. Der Ausschlag bleibt auch ohne Stab bestehen.'][electro];}
function updateFlow(){current=+$('curr').value;seconds=+$('sec').value;let a=fmt(current)+' A',t=fmt(seconds)+' s',q=fmt(current*seconds)+' C';$('currout').textContent=a;$('secout').textContent=t;$('mI').textContent=a;$('mt').textContent=t;$('mQ').textContent=q;$('qformula').textContent=`Q = ${a} · ${t} = ${q}`;}
function updateCoul(){distance=+$('dist').value;$('coulmodel').innerHTML=coulSVG();bindGroup('signcontrols',sign,v=>{sign=v;updateCoul()});$('distout').textContent=fmt(distance/100)+' m';$('charge2').textContent=(sign===1?'+':'−')+'3 µC';$('force').textContent=fmt(8.9875517923e9*6e-12/(distance/100)**2,3)+' N';}
function reset(){if(!confirm('Eine neue 60-Minuten-Einheit beginnen? Alle bisherigen Markierungen werden dabei gelöscht.'))return;state={start:Date.now(),done:Array(7).fill(false),page:0};influence=0;electro=0;current=2;seconds=3;distance=30;sign=-1;$('timerbox').querySelector('small').textContent='Restzeit';clock();go(0);}
function render(){nav();if(page===7){$('main').innerHTML=board();$('backbtn').onclick=()=>go(6);$('resetbtn').onclick=reset;return;}
const c=chapters[page];$('main').innerHTML=(page===0?intro():'')+`<div class="section-head"><div><div class="eyebrow">Station ${String(page+1).padStart(2,'0')} / 07</div><h2>${c.title}</h2></div><span>≈ ${c.time} min</span></div><p class="muted" style="margin:-5px 0 18px">${c.goal}</p>`+content[page]()+note(page)+`<div class="bottomnav"><button class="secondary" id="backbtn" ${page===0?'disabled':''}>← Zurück</button><button class="primary" id="nextbtn">${page===6?'Zum Abschluss':'Nächstes Kapitel'} →</button></div>`;
$('donecheck').onchange=e=>{state.done[page]=e.target.checked;save();nav()};$('backbtn').onclick=()=>go(page-1);$('nextbtn').onclick=()=>go(page===6?7:page+1);if(page===2)updateInf();if(page===3)updateElec();if(page===4){$('curr').oninput=updateFlow;$('sec').oninput=updateFlow;updateFlow()}if(page===6){$('dist').oninput=updateCoul;updateCoul()}}
$('restarttop').onclick=reset;
$('menubtn').onclick=()=>{const open=$('sidebar').classList.toggle('open');$('menubtn').setAttribute('aria-expanded',String(open))};

save();render();clock();setInterval(clock,1000);
</script></body></html>
